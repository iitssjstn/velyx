# Velyx — Your media. Your server.
# Uses the image that GitHub Actions publishes to GHCR — nothing is built on the server.
# Put this file and a .env (see .env.example) in one folder on your VPS, then run:
#   docker compose pull && docker compose up -d
services:
  velyx:
    image: ${VELYX_IMAGE:-ghcr.io/iitssjstn/velyx:latest}
    container_name: velyx
    restart: unless-stopped
    ports:
      - "${VELYX_PORT:-3000}:3000"
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      # Run as the user/group that owns your media files (check with: id your-user)
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Set TRUST_PROXY=true when Velyx runs behind a reverse proxy (Nginx Proxy Manager, Caddy, Traefik).
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-360}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Database, artwork cache, avatars and backups
      - ${DATA_PATH:-./data}:/data
      # Your media, mounted read-only. Add more lines for extra drives, e.g.
      # - /mnt/disk2/films:/media/films-2:ro
      - ${MOVIES_PATH:-/srv/media/movies}:/media/movies:ro
      - ${TV_PATH:-/srv/media/tv}:/media/tv:ro
