<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vidalune</title>
    <meta name="robots" content="noindex" />
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <link rel="stylesheet" href="cast.css" />
    <style id="cue-style"></style>
  </head>
  <body>
    <!-- Vidalune's own player: Google's framework plays into this video, Vidalune draws the rest. -->
    <video id="video"></video>
    <div id="waiting" class="spinner" aria-hidden="true"></div>
    <div id="paused" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" /><rect x="14" y="5" width="4" height="14" rx="1" /></svg></div>
    <div id="keys" aria-hidden="true"></div>
    <div id="bar" aria-hidden="true">
      <div class="top">
        <img id="poster" alt="" />
        <div class="info">
          <div id="subtitle"></div>
          <div id="title"></div>
          <div class="progress"><div id="played"></div><div id="marks"></div></div>
          <div class="times"><span id="position">0:00</span><span id="length"></span></div>
        </div>
      </div>
      <div id="controls"></div>
    </div>
    <div id="skip" class="pill focus" aria-hidden="true"></div>
    <div id="upnext" aria-hidden="true">
      <div id="upnext-label" class="label"></div>
      <div class="row"><div id="upnext-still" class="still"><i id="upnext-count"></i></div><div><div id="upnext-code" class="code"></div><div id="upnext-title" class="name"></div><div id="upnext-length" class="code"></div></div></div>
      <div class="acts"><div id="upnext-play" class="pill"></div><div id="upnext-credits" class="pill"></div></div>
    </div>
    <div id="menu" aria-hidden="true"><div id="tabs"></div><h2 id="menu-title"></h2><div id="menu-hint" class="hint"></div><div id="items"></div></div>
    <div id="splash" aria-hidden="true"><img src="logo.svg" alt="" /><div id="splash-title"></div><div class="spinner"></div></div>
    <script type="module" src="receiver.js"></script>
  </body>
</html>
