# Builds Velyx from source (development/testing). For normal use, docker-compose.yml pulls the
# ready-made image from GHCR instead.
# Usage: docker compose -f docker-compose.build.yml up -d --build
services:
  velyx:
    build: .
    image: velyx:local
    container_name: velyx
    restart: unless-stopped
    ports:
      - "${VELYX_PORT:-3000}:3000"
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-360}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ${MOVIES_PATH:-./media/movies}:/media/movies:ro
      - ${TV_PATH:-./media/tv}:/media/tv:ro
