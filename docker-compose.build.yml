# Builds Velyx from this repository instead of pulling the published image (development/testing).
# For normal use, see the compose file in the README.
# Usage: docker compose -f docker-compose.build.yml up -d --build
services:
  velyx:
    build: .
    image: velyx:local
    container_name: velyx
    restart: unless-stopped
    ports:
      - "${VELYX_PORT:-3000}:3000"
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-360}
      # FFprobe processes at once while scanning (1–4); 1 keeps old CPUs responsive.
      SCAN_CONCURRENCY: ${SCAN_CONCURRENCY:-1}
      # Free space (GB) on the data volume for the low / critical warnings.
      LOW_DISK_GB: ${LOW_DISK_GB:-10}
      CRITICAL_DISK_GB: ${CRITICAL_DISK_GB:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ${MOVIES_PATH:-./media/movies}:/media/movies:ro
      - ${TV_PATH:-./media/tv}:/media/tv:ro
