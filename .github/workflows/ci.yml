name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install FFmpeg (for the real FFprobe/FFmpeg tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: velyx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          mkdir -p media/movies media/tv data
          docker run -d --name velyx-ci -p 3000:3000 \
            -e PUID=$(id -u) -e PGID=$(id -g) \
            -v "$PWD/data:/data" -v "$PWD/media/movies:/media/movies:ro" -v "$PWD/media/tv:/media/tv:ro" velyx:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then exit 0; fi
            sleep 2
          done
          docker logs velyx-ci
          exit 1
