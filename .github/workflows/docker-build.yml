name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # push the version tag (see "Tag the release" below)
  packages: write

# A newer push cancels a build that is still running, so an older commit can never overwrite :latest.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On main, a version in package.json without a matching v<version> tag is a new release:
      # its image also gets the version tags, and the git tag is created once the image is pushed.
      - name: Detect new release
        id: release
        if: github.ref == 'refs/heads/main'
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "New release v$version"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR requires a lowercase image name
          images: ghcr.io/${{ github.repository_owner }}/velyx
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.new == 'true' }}
            type=raw,value=${{ steps.release.outputs.minor }},enable=${{ steps.release.outputs.new == 'true' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tags pushed with GITHUB_TOKEN do not start this workflow again, so the image is built only once.
      - name: Tag the release
        if: steps.release.outputs.new == 'true'
        run: |
          git tag "v${{ steps.release.outputs.version }}"
          git push origin "v${{ steps.release.outputs.version }}"
