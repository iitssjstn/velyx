name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # push the version tag (see "Tag the release" below)
  packages: write

# A newer push cancels a build that is still running, so an older commit can never overwrite :latest.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Docker Hub (hub.docker.com/r/vidalune/vidalune): only once its repository secrets are set. They
    # go to the two steps that use them only.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # On main, a version in package.json without a matching v<version> tag is a new release:
      # its image also gets the version tags, and the git tag is created once the image is pushed.
      - name: Detect new release
        id: release
        if: github.ref == 'refs/heads/main'
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "New release v$version"
          fi

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Hub set up?
        id: dockerhub
        env:
          SET: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_USERNAME != '' }}
        run: echo "set=$SET" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        id: dockerhub-login
        if: steps.dockerhub.outputs.set == 'true'
        continue-on-error: true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          # GHCR requires a lowercase image name. The image is also published under its name from
          # before the rename, so existing installations keep updating.
          images: |
            ghcr.io/${{ github.repository_owner }}/vidalune
            ghcr.io/${{ github.repository_owner }}/velyx
            name=docker.io/vidalune/vidalune,enable=${{ steps.dockerhub-login.outcome == 'success' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.new == 'true' }}
            type=raw,value=${{ steps.release.outputs.minor }},enable=${{ steps.release.outputs.new == 'true' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The page on Docker Hub. Needs a token that may also change the repository ("Read, Write,
      # Delete"); with a read/write token only the images are published and this step is skipped.
      - name: Docker Hub description
        if: steps.dockerhub-login.outcome == 'success' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: vidalune/vidalune
          short-description: Your media. Your server. Self-hosted media server that never transcodes video.
          readme-filepath: docker/DOCKERHUB.md

      # Tags pushed with GITHUB_TOKEN do not start this workflow again, so the image is built only once.
      - name: Tag the release
        if: steps.release.outputs.new == 'true'
        run: |
          git tag "v${{ steps.release.outputs.version }}"
          git push origin "v${{ steps.release.outputs.version }}"
