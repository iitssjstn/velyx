name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # push the version tag (see "Tag the release" below)
  packages: write

# A newer push cancels a build that is still running, so an older commit can never overwrite :latest.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Docker Hub (hub.docker.com/r/vidalune/vidalune): only once these repository secrets are set.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # On main, a version in package.json without a matching v<version> tag is a new release:
      # its image also gets the version tags, and the git tag is created once the image is pushed.
      - name: Detect new release
        id: release
        if: github.ref == 'refs/heads/main'
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "New release v$version"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR requires a lowercase image name. The image is also published under its name from
          # before the rename, so existing installations keep updating.
          images: |
            ghcr.io/${{ github.repository_owner }}/vidalune
            ghcr.io/${{ github.repository_owner }}/velyx
            name=docker.io/vidalune/vidalune,enable=${{ env.DOCKERHUB_TOKEN != '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.new == 'true' }}
            type=raw,value=${{ steps.release.outputs.minor }},enable=${{ steps.release.outputs.new == 'true' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The page on Docker Hub. Needs a token that may also change the repository ("Read, Write,
      # Delete"); with a read/write token only the images are published and this step is skipped.
      - name: Docker Hub description
        if: env.DOCKERHUB_TOKEN != '' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
          repository: vidalune/vidalune
          short-description: Your media. Your server. Self-hosted media server that never transcodes video.
          readme-filepath: docker/DOCKERHUB.md

      # Tags pushed with GITHUB_TOKEN do not start this workflow again, so the image is built only once.
      - name: Tag the release
        if: steps.release.outputs.new == 'true'
        run: |
          git tag "v${{ steps.release.outputs.version }}"
          git push origin "v${{ steps.release.outputs.version }}"
