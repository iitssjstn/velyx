name: Account service image

# The Vidalune account service (vidalune.com): tested with the rest in CI, built here, and published
# as ghcr.io/<owner>/vidalune-cloud when it changes on main.
on:
  push:
    branches: [main]
    paths: ['cloud/**', 'frontend/**', 'package-lock.json', '.github/workflows/cloud-image.yml', '.github/workflows/android.yml', '.github/workflows/deb.yml', '.github/workflows/windows.yml']
  pull_request:
    paths: ['cloud/**', 'frontend/**', '.github/workflows/cloud-image.yml']
  # Once the Windows installer of a release is built (it finishes after the Debian packages and the
  # Android app), windows.yml starts this again, so vidalune.com hands them all out. Once per
  # release, not after each of them (saves build minutes). Not through workflow_run: GitHub runs at
  # most three workflows in a row that way, and this would be the fourth.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cloud-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Version
        id: version
        run: echo "version=$(node -p "require('./cloud/package.json').version")" >> "$GITHUB_OUTPUT"

      # The Android app, Debian packages and Windows installer of the newest release, handed out at
      # vidalune.com/download/app, /download/deb/<arch> and /download/windows.
      - name: Android app, Debian packages and Windows installer
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern 'vidalune-*.apk' --pattern 'vidalune_*.deb' --pattern 'vidalune-*-setup.exe' --dir cloud/downloads || echo "Nothing released yet."

      - name: Verify release Debian packages
        if: github.event_name == 'workflow_dispatch'
        run: |
          version=$(node -p "require('./package.json').version")
          for arch in amd64 arm64; do
            file="cloud/downloads/vidalune_${version}_${arch}.deb"
            test -s "$file" || { echo "Missing release package: $file" >&2; exit 1; }
          done

      # The signed apt repository at vidalune.com/apt, from the packages of the newest release.
      - name: Apt repository
        if: github.event_name != 'pull_request'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -z "$APT_SIGNING_KEY" ]; then echo "APT_SIGNING_KEY is required to publish a release cloud image." >&2; exit 1; fi
          if [ -z "$APT_SIGNING_KEY" ] || ! ls cloud/downloads/vidalune_*.deb > /dev/null 2>&1; then echo "No signing key or no packages: no apt repository."; exit 0; fi
          command -v apt-ftparchive > /dev/null || sudo apt-get install -y -qq apt-utils
          sh packaging/apt/build-repo.sh cloud/downloads cloud/downloads/apt

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: cloud/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/vidalune-cloud:latest
            ghcr.io/${{ github.repository_owner }}/vidalune-cloud:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=cloud
          # Runs started by another workflow (after the Android app) may read the cache but not write it.
          cache-to: ${{ github.event_name != 'workflow_dispatch' && 'type=gha,mode=max,scope=cloud,ignore-error=true' || '' }}

      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name cloud -p 3100:3100 -e PUBLIC_URL=http://localhost:3100 ghcr.io/${{ github.repository_owner }}/vidalune-cloud:latest
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3100/health && curl -fsS http://localhost:3100/ | grep -q 'href="/install"' && curl -fsS http://localhost:3100/account | grep -q account.js && curl -fsS http://localhost:3100/install | grep -q docker-compose; then exit 0; fi
            sleep 2
          done
          docker logs cloud
          exit 1
