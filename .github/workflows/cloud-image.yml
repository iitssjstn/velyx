name: Account service image

# The Vidalune account service (vidalune.com): tested with the rest in CI, built here, and published
# as ghcr.io/<owner>/vidalune-cloud when it changes on main.
on:
  push:
    branches: [main]
    paths: ['cloud/**', 'frontend/**', 'package-lock.json', '.github/workflows/cloud-image.yml']
  pull_request:
    paths: ['cloud/**', 'frontend/**', '.github/workflows/cloud-image.yml']
  # Once the Android app of a release is built (it finishes after the Debian packages): again, so
  # vidalune.com hands both out. Once per release, not after each of them (saves build minutes).
  workflow_run:
    workflows: ['Android app']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cloud-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    # Also when the APK failed: the Debian packages and the website still go out.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Version
        id: version
        run: echo "version=$(node -p "require('./cloud/package.json').version")" >> "$GITHUB_OUTPUT"

      # The Android app and Debian packages of the newest release, handed out at
      # vidalune.com/download/app and /download/deb/<arch>.
      - name: Android app and Debian packages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern 'vidalune-*.apk' --pattern 'vidalune_*.deb' --dir cloud/downloads || echo "Nothing released yet."

      # The signed apt repository at vidalune.com/apt, from the packages of the newest release.
      - name: Apt repository
        if: github.event_name != 'pull_request'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ] || ! ls cloud/downloads/vidalune_*.deb > /dev/null 2>&1; then echo "No signing key or no packages: no apt repository."; exit 0; fi
          command -v apt-ftparchive > /dev/null || sudo apt-get install -y -qq apt-utils
          sh packaging/apt/build-repo.sh cloud/downloads cloud/downloads/apt

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cloud/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/vidalune-cloud:latest
            ghcr.io/${{ github.repository_owner }}/vidalune-cloud:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=cloud
          # Runs started by another workflow (after the Android app) may read the cache but not write it.
          cache-to: ${{ github.event_name != 'workflow_run' && 'type=gha,mode=max,scope=cloud,ignore-error=true' || '' }}

      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name cloud -p 3100:3100 -e PUBLIC_URL=http://localhost:3100 ghcr.io/${{ github.repository_owner }}/vidalune-cloud:latest
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3100/health && curl -fsS http://localhost:3100/ | grep -q 'href="/install"' && curl -fsS http://localhost:3100/account | grep -q account.js && curl -fsS http://localhost:3100/install | grep -q docker-compose; then exit 0; fi
            sleep 2
          done
          docker logs cloud
          exit 1
