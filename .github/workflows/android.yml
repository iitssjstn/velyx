name: Android app

# Builds the Vidalune app as an installable APK after the Debian packages are built and tested on
# main, where the APK is attached to the same GitHub release. With the upload key in the repository
# secrets it also builds an app bundle (.aab) signed with that key, for the Play Store. Not on pull requests, to save build
# minutes: CI runs the app's typecheck and tests there.
on:
  workflow_run:
    workflows: ['Debian package']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # attach the APK to the release

concurrency:
  group: android-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      # The Play Store upload key (see "CI" in the README). Without it no app bundle is built.
      ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
      ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check the app and server versions match
        run: |
          app=$(node -p "require('./package.json').version")
          config=$(node -p "require('./app.json').expo.version")
          server=$(node -p "require('../package.json').version")
          code=$(node -p "require('./app.json').expo.android.versionCode")
          expected=$(node -p "const [a,b,c]='$app'.split('.').map(Number); a*10000+b*100+c")
          echo "app $app, app.json $config, server $server, versionCode $code"
          test "$app" = "$config" && test "$app" = "$server" && test "$code" = "$expected"

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # The generated project gives Gradle 2 GB, too little to merge the release build's code; the
      # runner has 16 GB.
      - name: Give Gradle enough memory
        working-directory: app/android
        run: |
          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          # The file may not end with a newline; never glue this onto its last setting.
          printf '\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n' >> gradle.properties
          tail -n 3 gradle.properties

      - name: Build the APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        id: apk
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/vidalune-$version.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=app/out/vidalune-$version.apk" >> "$GITHUB_OUTPUT"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: vidalune-${{ steps.apk.outputs.version }}-apk
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30

      # The Play Store only takes a bundle signed with the upload key; the APK keeps its own signature,
      # so installed copies keep updating. The key is passed to this one Gradle run only and is never
      # written into the project.
      - name: Build the app bundle for the Play Store
        id: aab
        working-directory: app/android
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE" ]; then
            echo "::warning::No ANDROID_UPLOAD_KEYSTORE secret: no app bundle for the Play Store."
            exit 0
          fi
          for name in ANDROID_UPLOAD_STORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            if [ -z "$(printenv "$name")" ]; then echo "The $name secret is missing." >&2; exit 1; fi
          done
          keystore="$RUNNER_TEMP/upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE" | base64 -d > "$keystore"
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_UPLOAD_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_UPLOAD_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_UPLOAD_KEY_PASSWORD"
          rm -f "$keystore"
          bundle=app/build/outputs/bundle/release/app-release.aab
          # Never hand the Play Store a bundle that still carries the debug signature.
          signer=$(keytool -printcert -jarfile "$bundle")
          printf '%s\n' "$signer" | grep -E 'Owner:|SHA256:'
          if printf '%s' "$signer" | grep -q 'CN=Android Debug'; then
            echo "The app bundle is signed with the debug key, not the upload key." >&2
            exit 1
          fi
          version=$(node -p "require('../package.json').version")
          cp "$bundle" "../out/vidalune-$version.aab"
          echo "file=app/out/vidalune-$version.aab" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.aab.outputs.file != ''
        with:
          name: vidalune-${{ steps.apk.outputs.version }}-aab
          path: ${{ steps.aab.outputs.file }}
          retention-days: 30

      # After a release build on main: attach the APK to the release of this exact commit.
      - name: Attach to the release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="v$VERSION"
          if ! git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then git fetch --tags --quiet; fi
          if [ "$(git rev-list -n 1 "$tag" 2>/dev/null)" != "$SHA" ]; then
            echo "$tag does not point at this commit; nothing to attach."
            exit 0
          fi
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --verify-tag --title "Vidalune $VERSION" --notes "Vidalune $VERSION. The Android app is attached as vidalune-$VERSION.apk (install it on an Android phone or tablet; see the README)."
          gh release upload "$tag" "out/vidalune-$VERSION.apk" --clobber
          if [ -f "out/vidalune-$VERSION.aab" ]; then gh release upload "$tag" "out/vidalune-$VERSION.aab" --clobber; fi
