name: Android app

# Builds the Vidalune app as an installable APK after the Debian packages are built and tested on
# main, where the APK is attached to the same GitHub release. The APK and an app bundle (.aab) for the
# Play Store are signed with the upload key from the repository secrets (no key, no app); with a Play
# service account it sends that bundle to the internal test track when the app changed since the
# previous release. A release whose app did not change (only its version number) builds nothing: it
# carries the previous release's APK and bundle over, so the release and the website still have them.
# Not on pull requests, to save build minutes: CI runs the app's typecheck and tests there.
on:
  workflow_run:
    workflows: ['Debian package']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      play_store:
        description: Also send the app bundle to the Play Store's internal test track
        type: boolean
        default: false

permissions:
  contents: write # attach the APK to the release

concurrency:
  group: android-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # The secrets (upload key, Play service account; see "CI" in the README) are given only to the
    # steps that use them, never to npm, Gradle plugins or tests in other steps.
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # A release whose app is unchanged since the previous release builds nothing (to save build
      # minutes); a manual run always builds.
      - name: Decide whether to build the app
        id: build
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          needed=true
          previous=""
          version=$(node -p "require('./app/package.json').version")
          if [ "$EVENT" = workflow_run ] && [ "$(git rev-list -n 1 "v$version" 2>/dev/null)" = "$SHA" ]; then
            previous=$(git describe --tags --match 'v*' --abbrev=0 "$SHA^" 2>/dev/null || true)
            if [ -n "$previous" ] && [ "$(.github/scripts/app-changed.sh "$previous" "$SHA")" = false ]; then needed=false; fi
          fi
          # The previous release's APK still signed with the shared debug key (before 0.19.100): build anyway.
          if [ "$needed" = false ]; then
            mkdir -p "$RUNNER_TEMP/previous"
            gh release download "$previous" --pattern 'vidalune-*.apk' --dir "$RUNNER_TEMP/previous"
            apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner
            if "$apksigner" verify --print-certs "$RUNNER_TEMP"/previous/vidalune-*.apk | grep -q 'CN=Android Debug'; then
              echo "The APK of $previous is signed with the debug key: building one with the release key."
              needed=true
            fi
          fi
          echo "App build needed: $needed (previous release: ${previous:-none})"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.build.outputs.needed == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.build.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: steps.build.outputs.needed == 'true'

      - name: Install dependencies
        if: steps.build.outputs.needed == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.build.outputs.needed == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.build.outputs.needed == 'true'
        run: npm test

      - name: Check the app and server versions match
        if: steps.build.outputs.needed == 'true'
        run: |
          app=$(node -p "require('./package.json').version")
          config=$(node -p "require('./app.json').expo.version")
          server=$(node -p "require('../package.json').version")
          code=$(node -p "require('./app.json').expo.android.versionCode")
          expected=$(node -p "const [a,b,c]='$app'.split('.').map(Number); a*10000+b*100+c")
          echo "app $app, app.json $config, server $server, versionCode $code"
          test "$app" = "$config" && test "$app" = "$server" && test "$code" = "$expected"

      - name: Generate the Android project
        if: steps.build.outputs.needed == 'true'
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # The generated project gives Gradle 2 GB, too little to merge the release build's code; the
      # runner has 16 GB.
      - name: Give Gradle enough memory
        if: steps.build.outputs.needed == 'true'
        working-directory: app/android
        run: |
          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          # The file may not end with a newline; never glue this onto its last setting.
          printf '\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n' >> gradle.properties
          tail -n 3 gradle.properties

      # Signed with the upload key, never with the debug key every Android developer has: an update
      # signed with that one could replace the app and read its sign-in. The key is passed to this
      # one Gradle run only and is never written into the project.
      - name: Build the APK
        if: steps.build.outputs.needed == 'true'
        working-directory: app/android
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          for name in ANDROID_UPLOAD_KEYSTORE ANDROID_UPLOAD_STORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            if [ -z "$(printenv "$name")" ]; then echo "The $name secret is missing: no APK without the release key." >&2; exit 1; fi
          done
          keystore="$RUNNER_TEMP/upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE" | base64 -d > "$keystore"
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_UPLOAD_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_UPLOAD_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_UPLOAD_KEY_PASSWORD"
          rm -f "$keystore"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner
          signer=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk)
          printf '%s\n' "$signer" | grep -E 'Signer #1 certificate (DN|SHA-256)'
          if printf '%s' "$signer" | grep -q 'CN=Android Debug'; then
            echo "The APK is signed with the debug key, not the release key." >&2
            exit 1
          fi

      - name: Name the APK
        if: steps.build.outputs.needed == 'true'
        id: apk
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/vidalune-$version.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=app/out/vidalune-$version.apk" >> "$GITHUB_OUTPUT"
          ls -la out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.build.outputs.needed == 'true'
        with:
          name: vidalune-${{ steps.apk.outputs.version }}-apk
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30

      # The Play Store only takes a bundle signed with the upload key (as the APK above).
      - name: Build the app bundle for the Play Store
        if: steps.build.outputs.needed == 'true'
        id: aab
        working-directory: app/android
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE" | base64 -d > "$keystore"
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_UPLOAD_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_UPLOAD_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_UPLOAD_KEY_PASSWORD"
          rm -f "$keystore"
          bundle=app/build/outputs/bundle/release/app-release.aab
          # Never hand the Play Store a bundle that still carries the debug signature.
          signer=$(keytool -printcert -jarfile "$bundle")
          printf '%s\n' "$signer" | grep -E 'Owner:|SHA256:'
          if printf '%s' "$signer" | grep -q 'CN=Android Debug'; then
            echo "The app bundle is signed with the debug key, not the upload key." >&2
            exit 1
          fi
          version=$(node -p "require('../package.json').version")
          cp "$bundle" "../out/vidalune-$version.aab"
          echo "file=app/out/vidalune-$version.aab" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.build.outputs.needed == 'true' && steps.aab.outputs.file != ''
        with:
          name: vidalune-${{ steps.apk.outputs.version }}-aab
          path: ${{ steps.aab.outputs.file }}
          retention-days: 30

      # After a release build on main: attach the APK to the release of this exact commit.
      - name: Attach to the release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          NEEDED: ${{ steps.build.outputs.needed }}
          PREVIOUS: ${{ steps.build.outputs.previous }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="v$VERSION"
          if ! git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then git fetch --tags --quiet; fi
          if [ "$(git rev-list -n 1 "$tag" 2>/dev/null)" != "$SHA" ]; then
            echo "$tag does not point at this commit; nothing to attach."
            exit 0
          fi
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --verify-tag --title "Vidalune $VERSION" --notes "Vidalune $VERSION. The Android app is attached as an .apk (install it on an Android phone or tablet; see the README)."
          if [ "$NEEDED" = true ]; then
            gh release upload "$tag" "out/vidalune-$VERSION.apk" --clobber
            if [ -f "out/vidalune-$VERSION.aab" ]; then gh release upload "$tag" "out/vidalune-$VERSION.aab" --clobber; fi
          else
            # The app did not change: the previous release's app goes along, under its own version.
            mkdir -p carried
            gh release download "$PREVIOUS" --pattern 'vidalune-*.apk' --pattern 'vidalune-*.aab' --dir carried
            ls -la carried
            ls carried/vidalune-*.apk > /dev/null
            gh release upload "$tag" carried/* --clobber
          fi

      # Only a release whose app changed (more than its version number) goes to the Play Store; a
      # manual run goes when asked. Always the internal test track: production stays a step in the
      # Play Console. Last, so the release above is complete even when this fails.
      - name: Decide whether to send it to the Play Store
        id: play
        env:
          EVENT: ${{ github.event_name }}
          ASKED: ${{ inputs.play_store }}
          VERSION: ${{ steps.apk.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          BUNDLE: ${{ steps.aab.outputs.file }}
          HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        working-directory: .
        run: |
          send=false
          if [ -z "$BUNDLE" ]; then
            echo "No app bundle: nothing for the Play Store."
          elif [ "$HAS_PLAY" != true ]; then
            echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON secret: upload vidalune-$VERSION.aab in the Play Console yourself."
          elif [ "$EVENT" = workflow_dispatch ]; then
            send=$ASKED
          elif [ "$(git rev-list -n 1 "v$VERSION" 2>/dev/null)" != "$SHA" ]; then
            echo "v$VERSION does not point at this commit; not a release."
          else
            previous=$(git describe --tags --match 'v*' --abbrev=0 "$SHA^" 2>/dev/null || true)
            if [ -z "$previous" ]; then
              send=true
            else
              send=$(.github/scripts/app-changed.sh "$previous" "$SHA")
              echo "App changed since $previous: $send"
            fi
          fi
          echo "send=$send" >> "$GITHUB_OUTPUT"

      - name: Send to the Play Store (internal test)
        id: play_upload
        if: steps.play.outputs.send == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.vidalune.app
          releaseFiles: ${{ steps.aab.outputs.file }}
          releaseName: ${{ steps.apk.outputs.version }}
          track: internal
          status: completed

      # Until Google has reviewed the app once, the Play Store only takes a draft from outside the
      # Play Console; it is then rolled out there with one click.
      - name: Send to the Play Store as a draft
        if: steps.play_upload.outcome == 'failure'
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.vidalune.app
          releaseFiles: ${{ steps.aab.outputs.file }}
          releaseName: ${{ steps.apk.outputs.version }}
          track: internal
          status: draft

      - name: Say the draft still needs rolling out
        if: steps.play_upload.outcome == 'failure'
        run: echo "::warning::vidalune-${{ steps.apk.outputs.version }} is a draft on the internal test track; roll it out in the Play Console (Testing > Internal testing)."
