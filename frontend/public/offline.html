<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14121C" />
    <title>Vidalune</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: #14121c; color: #ece8f4; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 22rem; }
      svg { width: 64px; height: 64px; }
      h1 { font-size: 1.35rem; margin: 20px 0 8px; }
      p { color: #9a93ad; margin: 0 0 24px; }
      button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 10px 24px; background: #b69cff; color: #1b1430; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#1e1b29"/><path d="M14 16h10l8 22 8-22h10L37 48H27z" fill="#B69CFF"/><path d="M29 24l9 5-9 5z" fill="#1e1b29"/></svg>
      <h1 id="title">Vidalune is not reachable</h1>
      <p id="text">Check your internet connection, or whether the server is running, and try again.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
